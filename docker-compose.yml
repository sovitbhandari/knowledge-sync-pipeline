services:
  postgres:
    image: postgres:16-alpine
    container_name: ksp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ksp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ksp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_sync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ksp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ksp} -d ${POSTGRES_DB:-knowledge_sync}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ksp_pgdata:
